<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>California Globe Framer</title>
<script>window.CESIUM_BASE_URL = 'https://cdn.jsdelivr.net/npm/cesium@1.123.0/Build/Cesium/';</script>
<script src="https://cdn.jsdelivr.net/npm/cesium@1.123.0/Build/Cesium/Cesium.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script src="styles.js"></script>
<link href="https://cdn.jsdelivr.net/npm/cesium@1.123.0/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
<style>
  :root { --bg:#111; --panel:#1b1b1d; --fg:#e8e6e1; --muted:#9a978f; --accent:#f2b544; --line:#2c2c30; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:13px/1.4 -apple-system, system-ui, sans-serif; }
  .app { display:flex; height:100%; gap:16px; padding:16px; }
  .stage { flex:1; display:flex; align-items:center; justify-content:center; min-width:0; min-height:0; }
  #frame { flex:none; position:relative; box-shadow:0 0 0 1px #333; } /* sized in JS to keep the page aspect */
  #globe { position:absolute; inset:0; }
  #globe .cesium-viewer-bottom { display:none; }
  .safe { position:absolute; inset:0; pointer-events:none; display:none; }
  .safe.on { display:block; }
  .safe .mast { position:absolute; left:6%; right:6%; top:3%; height:14%; border:1px dashed rgba(255,255,255,.45); }
  .safe .mast span { position:absolute; left:6px; top:4px; font-size:11px; color:rgba(255,255,255,.6); }
  .safe .third { position:absolute; background:rgba(255,255,255,.18); }
  aside { width:300px; flex:none; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px; overflow:auto; }
  h1 { font-size:15px; margin:0 0 2px; }
  .hint { color:var(--muted); font-size:12px; margin:0 0 12px; }
  h2 { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:16px 0 6px; }
  label.row { display:grid; grid-template-columns: 84px 1fr 52px; align-items:center; gap:8px; margin:4px 0; }
  label.row output { text-align:right; font-variant-numeric:tabular-nums; color:var(--muted); }
  input[type=range] { width:100%; accent-color:var(--accent); }
  select, button, input[type=number] { background:#26262a; color:var(--fg); border:1px solid #3a3a40; border-radius:5px; padding:5px 8px; font:inherit; }
  button { cursor:pointer; }
  button.primary { background:var(--accent); color:#1a1408; border-color:var(--accent); font-weight:600; }
  .btns { display:flex; flex-wrap:wrap; gap:6px; }
  .check { display:flex; align-items:center; gap:6px; margin:4px 0; }
  pre { background:#121214; border:1px solid var(--line); border-radius:5px; padding:8px; font-size:11px; white-space:pre-wrap; margin:6px 0; color:#cfcac0; }
  #status { color:var(--muted); font-size:12px; margin-top:6px; min-height:1em; }
  @media (max-width: 760px) { .app { flex-direction:column; height:auto; } aside { width:100%; } }
</style>
</head>
<body>
<div class="app">
  <div class="stage">
    <div id="frame">
      <div id="globe"></div>
      <div class="safe" id="safe">
        <div class="mast"><span>masthead</span></div>
        <div class="third" style="left:33.33%;top:0;bottom:0;width:1px"></div>
        <div class="third" style="left:66.66%;top:0;bottom:0;width:1px"></div>
        <div class="third" style="top:33.33%;left:0;right:0;height:1px"></div>
        <div class="third" style="top:66.66%;left:0;right:0;height:1px"></div>
      </div>
    </div>
  </div>

  <aside>
    <h1>California Globe Framer</h1>
    <p class="hint">Drag to orbit · scroll to zoom · shift-drag to move the target · alt-drag to roll.</p>

    <h2>Presets</h2>
    <div class="btns" id="presets"></div>

    <h2>Camera</h2>
    <div id="sliders"></div>

    <h2>Look</h2>
    <label class="row">Style
      <select id="style" style="grid-column: span 2"></select>
    </label>
    <div id="lookSliders"></div>
    <label class="check"><input type="checkbox" id="outline" checked> California outline</label>

    <h2>Frame</h2>
    <label class="row">Aspect
      <select id="aspect" style="grid-column: span 2">
        <option value="8.5/11">Magazine 8.5 × 11</option>
        <option value="8.375/10.875">Magazine 8⅜ × 10⅞</option>
        <option value="4/5">4 : 5</option>
        <option value="1/1">Square</option>
        <option value="16/9">16 : 9</option>
      </select>
    </label>
    <label class="check"><input type="checkbox" id="guides"> Masthead + thirds guides</label>

    <h2>Export</h2>
    <label class="row">Height px <input type="number" id="exportH" value="3300" min="500" max="8000" step="100" style="grid-column: span 2"></label>
    <div class="btns">
      <button class="primary" id="exportBtn">Export PNG</button>
      <button id="kmlBtn">Copy Google Earth view</button>
    </div>
    <div id="status"></div>

    <h2>Camera position (for Google Earth Pro / Blender)</h2>
    <pre id="readout"></pre>
  </aside>
</div>

<script>
const C = Cesium;
const rad = C.Math.toRadians, deg = C.Math.toDegrees;

// All camera state lives here; the camera is always derived from it.
const s = { lat: 37.0, lon: -119.4, range: 1900, heading: -12, pitch: -32, roll: 0, fov: 55,
            brightness: 1.6, contrast: 1.3, mask: 0.45, bloom: 0 };

const PRESETS = {
  'From the south': { lat: 37.0, lon: -119.4, range: 1900, heading: -12, pitch: -32, roll: 0, fov: 55 },
  'ISS diagonal':   { lat: 36.6, lon: -119.2, range: 1500, heading: -35, pitch: -42, roll: 6, fov: 62 },
  'From the SW':    { lat: 37.3, lon: -119.6, range: 1700, heading: 18, pitch: -48, roll: 0, fov: 55 },
  'High & flat':    { lat: 37.2, lon: -119.4, range: 4200, heading: -20, pitch: -60, roll: 0, fov: 40 },
};

const viewer = new C.Viewer('globe', {
  baseLayer: false, animation: false, timeline: false, baseLayerPicker: false, geocoder: false,
  homeButton: false, sceneModePicker: false, navigationHelpButton: false, fullscreenButton: false,
  infoBox: false, selectionIndicator: false,
  contextOptions: { webgl: { preserveDrawingBuffer: true } },
});
const scene = viewer.scene, camera = viewer.camera;
scene.globe.baseColor = C.Color.BLACK;
scene.globe.enableLighting = false;
scene.moon.show = false;
scene.sun.show = false;
scene.backgroundColor = C.Color.BLACK;
scene.screenSpaceCameraController.enableInputs = false;
viewer.useBrowserRecommendedResolution = false;

const gibs = (layer, date, ext) => new C.UrlTemplateImageryProvider({
  url: `https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/${layer}/default/${date}/GoogleMapsCompatible_Level8/{z}/{y}/{x}.${ext}`,
  maximumLevel: 8, credit: 'NASA GIBS',
});
const layers = {
  night: viewer.imageryLayers.addImageryProvider(gibs('VIIRS_Black_Marble', '2016-01-01', 'png')),
  day: viewer.imageryLayers.addImageryProvider(gibs('BlueMarble_ShadedRelief_Bathymetry', '2004-08-01', 'jpeg')),
};
// Faint grayscale terrain drawn over the main imagery (style.imagery.relief); kept out of `layers`
// so the brightness/contrast sliders don't touch it
const reliefLayer = viewer.imageryLayers.addImageryProvider(gibs('BlueMarble_ShadedRelief_Bathymetry', '2004-08-01', 'jpeg'));
Object.assign(reliefLayer, { show: false, saturation: 0, contrast: 1.6, brightness: 1.1 });
scene.globe.depthTestAgainstTerrain = true; // hide linework on the far side of the globe

const css = c => C.Color.fromCssColorString(c);
let style = null;
let maskColor = C.Color.BLACK;

// California outline + darkening mask outside the state
const outlineEntities = [];
const lineSets = { borders: [], graticule: [] }; // arrays of Cartesian3[]
const linePrims = {};
const toPositions = line => C.Cartesian3.fromDegreesArrayHeights(line.flatMap(([x, y]) => [x, y, 300]));
const dataReady = Promise.all([
  fetch('https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json').then(r => r.json()),
  fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json').then(r => r.json()),
]).then(([us, world]) => {
  const ca = topojson.feature(us, us.objects.states).features.find(f => f.id === '06');
  const polys = ca.geometry.type === 'MultiPolygon' ? ca.geometry.coordinates : [ca.geometry.coordinates];
  const holes = [];
  for (const poly of polys) {
    const ring = poly[0];
    holes.push(new C.PolygonHierarchy(C.Cartesian3.fromDegreesArray(ring.flat())));
    outlineEntities.push(viewer.entities.add({ polyline: {
      positions: C.Cartesian3.fromDegreesArrayHeights(ring.flatMap(([x, y]) => [x, y, 400])),
      width: 4, arcType: C.ArcType.RHUMB,
    }}));
  }
  const outer = C.Cartesian3.fromDegreesArray([-179, -50, -30, -50, -30, 85, -179, 85]);
  viewer.entities.add({ polygon: {
    hierarchy: new C.PolygonHierarchy(outer, holes), height: 200, arcType: C.ArcType.RHUMB,
    material: new C.ColorMaterialProperty(new C.CallbackProperty(() => maskColor.withAlpha(s.mask), false)),
  }});

  const stateBorders = topojson.mesh(us, us.objects.states, (a, b) => a !== b).coordinates;
  const worldLines = topojson.mesh(world, world.objects.countries).coordinates;
  lineSets.borders = [...stateBorders, ...worldLines].map(toPositions);
  landGeo = topojson.feature(world, world.objects.land);
  caPolys = polys;
});

// Dot-matrix land: a staggered grid of dots over land, larger where NASA night lights are bright.
// Land and lights are rasterised once into equirectangular grids covering this region.
const REGION = { w: -175, e: -45, s: 5, n: 80, res: 0.05 };
const RW = Math.round((REGION.e - REGION.w) / REGION.res), RH = Math.round((REGION.n - REGION.s) / REGION.res);
let landGeo, caPolys, landMask, caMask, lightGrid;

// polys: list of polygons, each a list of [lon, lat] rings
function rasterize(polys) {
  const cv = document.createElement('canvas');
  cv.width = RW; cv.height = RH;
  const g = cv.getContext('2d');
  g.beginPath();
  for (const poly of polys) {
    for (const ring of poly) {
      ring.forEach(([x, y], i) => g[i ? 'lineTo' : 'moveTo']((x - REGION.w) / REGION.res, (REGION.n - y) / REGION.res));
      g.closePath();
    }
  }
  g.fill('evenodd');
  const px = g.getImageData(0, 0, RW, RH).data;
  const mask = new Uint8Array(RW * RH);
  for (let i = 0; i < mask.length; i++) mask[i] = px[i * 4 + 3] > 127;
  return mask;
}

async function loadLights() {
  // Half resolution (~11 km/px) is plenty for 14 km dot spacing and is a 70 KB download instead of 3 MB
  const url = 'https://gibs.earthdata.nasa.gov/wms/epsg4326/best/wms.cgi?SERVICE=WMS&REQUEST=GetMap&VERSION=1.3.0'
    + `&LAYERS=VIIRS_Black_Marble&STYLES=&CRS=EPSG:4326&BBOX=${REGION.s},${REGION.w},${REGION.n},${REGION.e}`
    + `&WIDTH=${RW / 2}&HEIGHT=${RH / 2}&FORMAT=image/jpeg&TIME=2016-01-01`;
  const img = await createImageBitmap(await (await fetch(url)).blob());
  const cv = document.createElement('canvas');
  cv.width = RW; cv.height = RH;
  const g = cv.getContext('2d');
  g.drawImage(img, 0, 0, RW, RH);
  const px = g.getImageData(0, 0, RW, RH).data;
  const grid = new Uint8Array(RW * RH);
  for (let i = 0; i < grid.length; i++) grid[i] = Math.max(px[i * 4], px[i * 4 + 1], px[i * 4 + 2]);
  return grid;
}

let dotPrims = null, dotToken = 0;
async function setDots(spec) {
  const token = ++dotToken;
  if (dotPrims) scene.primitives.remove(dotPrims);
  dotPrims = null;
  if (!spec || !landGeo) return;
  landMask ||= rasterize(landGeo.features.flatMap(f => f.geometry.type === 'Polygon' ? [f.geometry.coordinates] : f.geometry.coordinates));
  caMask ||= rasterize(caPolys);
  if (spec.lights > 0) lightGrid ||= await loadLights().catch(() => null);
  if (token !== dotToken) return; // style changed while loading

  const col = new C.PointPrimitiveCollection();
  const base = css(spec.color);
  const scale = new C.NearFarScalar(3e5, 1.6, 6e6, 0.35);
  // California gets its own grid at `spacing`; other land uses `outsideSpacing` (sparser = darker tone)
  const addGrid = (spacingKm, inCalifornia) => {
    const dLat = spacingKm / 111.2;
    let row = 0;
    for (let lat = REGION.s; lat < REGION.n; lat += dLat, row++) {
      const dLon = dLat / Math.cos(rad(lat));
      for (let lon = REGION.w + (row % 2) * dLon / 2; lon < REGION.e; lon += dLon) {
        const x = Math.floor((lon - REGION.w) / REGION.res), y = Math.floor((REGION.n - lat) / REGION.res);
        const cell = y * RW + x;
        if (!landMask[cell] || !!caMask[cell] !== inCalifornia) continue;
        let light = 0;
        if (lightGrid) for (let j = -2; j <= 2; j++) for (let i = -2; i <= 2; i++) light = Math.max(light, lightGrid[(y + j) * RW + x + i] || 0);
        const l = Math.pow(light / 255, 1.5) * spec.lights;
        col.add({
          position: C.Cartesian3.fromDegrees(lon, lat, 1500),
          pixelSize: spec.size * (1 + 1.8 * l),
          color: base.withAlpha(Math.min(1, spec.alpha * (1 + 1.5 * l))),
          scaleByDistance: scale,
        });
      }
    }
  };
  addGrid(spec.spacing, true);
  addGrid(spec.outsideSpacing ?? spec.spacing, false);
  dotPrims = scene.primitives.add(col);
}

function graticule(step) {
  const lines = [];
  for (let lat = -80; lat <= 80; lat += step) {
    const l = [];
    for (let lon = -180; lon <= 180; lon += 1) l.push([lon, lat]);
    lines.push(l);
  }
  for (let lon = -180; lon < 180; lon += step) {
    const l = [];
    for (let lat = -85; lat <= 85; lat += 1) l.push([lon, lat]);
    lines.push(l);
  }
  return lines.map(toPositions);
}

function setLines(key, sets, spec) {
  if (linePrims[key]) scene.primitives.remove(linePrims[key]);
  linePrims[key] = null;
  if (!spec) return;
  const col = new C.PolylineCollection();
  const material = C.Material.fromType('Color', { color: css(spec.color) });
  for (const positions of sets) col.add({ positions, width: spec.width, material });
  linePrims[key] = scene.primitives.add(col);
}

// Screen-space effects: gradient sky, sheen, horizon shells and lines, pattern, paper, vignette,
// line + halo along the globe's edge, and grain
const earthEye = new C.Cartesian3();
const fx = scene.postProcessStages.add(new C.PostProcessStage({
  fragmentShader: `
    uniform sampler2D colorTexture;
    uniform sampler2D depthTexture;
    uniform vec3 earthEye;     // Earth's centre in eye coordinates
    uniform vec2 tanHalf;      // tan of half the horizontal / vertical field of view
    uniform vec4 limbColor;
    uniform float limbWidth;
    uniform float limbGlow;
    uniform float bgGradient;
    uniform vec4 bgTop;
    uniform vec4 bgBottom;
    uniform vec4 sheenColor;
    uniform vec4 lineColor;
    uniform float lineCount;
    uniform float lineRatio;   // each gap ÷ the previous gap
    uniform float lineFirst;   // first gap, in frame heights
    uniform float lineOverGlobe;
    uniform vec4 shellColor;
    uniform float shellCount;
    uniform float shellSpacing;
    uniform float shellEdge;
    uniform vec4 patternColor;
    uniform float patternScale;
    uniform float paper;
    uniform float paperScale;
    uniform float vignette;
    uniform float grain;
    in vec2 v_textureCoordinates;
    float sky(vec2 uv) { return czm_unpackDepth(texture(depthTexture, uv)) >= 1.0 ? 1.0 : 0.0; }

    // Hairlines get wider in pixels at export resolution so prints match the on-screen (retina) look
    float hairline(float coord) {
      float fw = fwidth(coord) * max(1.0, czm_pixelRatio * 0.5);
      return 1.0 - smoothstep(0.0, fw, abs(fract(coord + 0.5) - 0.5));
    }

    // Position relative to the Earth's horizon: y = angular height above the limb, x = distance along it.
    // Both are scaled to roughly fractions of the frame height, so effects keep their size at any lens.
    vec2 horizonCoords(vec2 uv) {
      vec3 rd = normalize(vec3((uv * 2.0 - 1.0) * tanHalf, -1.0));
      float D = length(earthEye);
      vec3 ax = earthEye / D;
      float limb = asin(clamp(6371000.0 / D, 0.0, 1.0));
      float beta = acos(clamp(dot(rd, ax), -1.0, 1.0));
      vec3 up = abs(ax.y) > 0.99 ? vec3(1.0, 0.0, 0.0) : vec3(0.0, 1.0, 0.0);
      vec3 e1 = normalize(up - ax * dot(up, ax));
      vec3 e2 = cross(ax, e1);
      vec3 q = rd - ax * dot(rd, ax);
      float theta = atan(dot(q, e2), dot(q, e1));
      float k = 0.5 / tanHalf.y;
      return vec2(theta * sin(limb) * k, (beta - limb) * k);
    }

    // Fine lines exactly parallel to the horizon, spaced in a geometric progression: the gap after
    // each line is lineRatio times the one before, so lines are tightest at the horizon and widen
    // steadily outward. Line n sits at height lineFirst * (lineRatio^n - 1) / (lineRatio - 1).
    float horizonLines(vec2 p) {
      float lineCoord = log(1.0 + max(p.y, 0.0) * (lineRatio - 1.0) / lineFirst) / log(lineRatio);
      float fw = fwidth(lineCoord) * max(1.0, czm_pixelRatio * 0.5);
      float line = 1.0 - smoothstep(0.0, fw, abs(fract(lineCoord + 0.5) - 0.5));
      line = mix(line, 0.45, smoothstep(0.15, 0.45, fw)); // where lines merge, use average coverage (avoids moiré)
      return line * step(0.0, p.y) * (1.0 - smoothstep(lineCount - 0.5, lineCount + 0.5, lineCoord)); // stop after the last line
    }

    float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float vnoise(vec2 p) {
      vec2 i = floor(p), f = fract(p);
      f = f * f * (3.0 - 2.0 * f);
      return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y);
    }
    float fbm(vec2 p) {
      float s = 0.0, a = 0.5;
      for (int i = 0; i < 5; i++) { s += a * vnoise(p); p *= 2.03; a *= 0.5; }
      return s;
    }

    void main() {
      vec2 uv = v_textureCoordinates;
      vec2 frame = vec2(uv.x * czm_viewport.z / czm_viewport.w, uv.y); // aspect-correct, height = 1
      vec4 c = texture(colorTexture, uv);
      float self = sky(uv);
      if (bgGradient > 0.0 && self > 0.0) c.rgb = mix(bgBottom.rgb, bgTop.rgb, uv.y);
      if (sheenColor.a > 0.0 && self < 1.0) {
        float t = clamp((1.0 - uv.x + uv.y) * 0.5, 0.0, 1.0);
        c.rgb += sheenColor.rgb * sheenColor.a * t * t;
      }
      if (paper > 0.0) {
        // Mottled tone plus faint horizontal fibres, like uneven cyanotype or printed stock
        float n = fbm(frame * paperScale) * 0.7 + fbm(frame * paperScale * vec2(1.0, 7.0) + 13.0) * 0.3;
        c.rgb *= 1.0 + (n - 0.5) * paper * 2.0;
      }
      if (patternColor.a > 0.0) {
        // Interlaced circles: two offset lattices of rings
        vec2 g = frame * patternScale;
        float r1 = length(fract(g) - 0.5) * 2.0, r2 = length(fract(g + 0.5) - 0.5) * 2.0;
        float pat = max(hairline(r1) * step(r1, 1.5), hairline(r2) * step(r2, 1.5));
        c.rgb = mix(c.rgb, patternColor.rgb, pat * patternColor.a);
      }
      if (shellCount > 0.0 || lineColor.a > 0.0) {
        vec2 hp = horizonCoords(uv);
        if (shellCount > 0.0) {
          // Stepped translucent layers above the horizon; spacing drifts along the arc so the
          // layers read as overlapping glass rings rather than perfect bullseyes
          float y = hp.y / (shellSpacing * (1.0 + 0.25 * sin(hp.x * 2.3 + 0.7)));
          float edge = hairline(y) * step(0.5, y) * step(y, shellCount + 0.5);
          if (self > 0.0) {
            float inside = step(0.0, y) * step(y, shellCount);
            c.rgb = mix(c.rgb, shellColor.rgb, inside * shellColor.a * (1.0 - floor(y) / shellCount));
            c.rgb = mix(c.rgb, shellColor.rgb, edge * shellEdge);
          }
        }
        if (lineColor.a > 0.0) {
          float a = horizonLines(hp) * lineColor.a * mix(lineOverGlobe, 1.0, self);
          c.rgb = mix(c.rgb, lineColor.rgb, a);
        }
      }
      if (limbGlow > 0.0 && self > 0.0) {
        float halo = 0.0;
        for (int j = 1; j <= 4; j++) {
          vec2 r = float(j) * 0.25 * limbGlow * czm_pixelRatio / czm_viewport.zw;
          for (int i = 0; i < 8; i++) {
            float a = float(i) * 0.7853982;
            halo += (1.0 - sky(uv + vec2(cos(a), sin(a)) * r)) * (1.0 - float(j) * 0.2);
          }
        }
        c.rgb = mix(c.rgb, limbColor.rgb, clamp(halo / 16.0, 0.0, 1.0) * limbColor.a * 0.6);
      }
      if (limbWidth > 0.0) {
        vec2 px = limbWidth * czm_pixelRatio / czm_viewport.zw;
        float edge = 0.0;
        for (int i = 0; i < 8; i++) {
          float a = float(i) * 0.7853982;
          edge += sky(uv + vec2(cos(a), sin(a)) * px);
        }
        edge = clamp(edge / 3.0, 0.0, 1.0); // soft coverage instead of a hard step, so the line isn't jagged
        c.rgb = mix(c.rgb, limbColor.rgb, edge * (1.0 - self) * limbColor.a);
      }
      if (vignette > 0.0) c.rgb *= 1.0 - vignette * pow(length(uv - 0.5) * 1.41, 2.5);
      if (grain > 0.0) {
        float n = fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233))) * 43758.5453);
        c.rgb += (n - 0.5) * grain;
      }
      out_FragColor = c;
    }`,
  uniforms: {
    earthEye: () => C.Matrix4.multiplyByPoint(camera.viewMatrix, C.Cartesian3.ZERO, earthEye),
    tanHalf: () => {
      const t = Math.tan(camera.frustum.fovy / 2);
      return new C.Cartesian2(t * camera.frustum.aspectRatio, t);
    },
    limbColor: C.Color.WHITE, limbWidth: 0, limbGlow: 0, bgGradient: 0, bgTop: C.Color.BLACK,
    bgBottom: C.Color.BLACK, sheenColor: C.Color.TRANSPARENT, lineColor: C.Color.TRANSPARENT,
    lineCount: 130, lineRatio: 1.02, lineFirst: 0.001, lineOverGlobe: 0, shellColor: C.Color.TRANSPARENT, shellCount: 0, shellSpacing: 0.05,
    shellEdge: 0, patternColor: C.Color.TRANSPARENT, patternScale: 6, paper: 0, paperScale: 4, vignette: 0, grain: 0,
  },
}));

function applyStyle(key) {
  style = { ...DEFAULT_STYLE, ...GLOBE_STYLES[key] };
  const im = style.imagery;
  for (const [name, layer] of Object.entries(layers)) {
    layer.show = !!im && im.layer === name;
    layer.saturation = im?.saturation ?? 1;
    layer.hue = C.Math.toRadians(im?.hue ?? 0);
    layer.gamma = im?.gamma ?? 1;
    layer.alpha = im?.alpha ?? 1;
    layer.colorToAlpha = im?.colorToAlpha ? css(im.colorToAlpha) : undefined;
    layer.colorToAlphaThreshold = im?.colorToAlphaThreshold ?? 0.004;
  }
  reliefLayer.show = (im?.relief ?? 0) > 0;
  reliefLayer.alpha = im?.relief ?? 0;
  s.brightness = im?.brightness ?? 1;
  s.contrast = im?.contrast ?? 1;
  s.mask = style.mask.alpha;
  s.bloom = style.bloom;
  maskColor = css(style.mask.color);

  scene.globe.baseColor = css(style.globeColor);
  const bg = [].concat(style.background);
  scene.backgroundColor = css(bg[bg.length - 1]);
  fx.uniforms.bgGradient = bg.length > 1 ? 1 : 0;
  fx.uniforms.bgTop = css(bg[0]);
  fx.uniforms.bgBottom = css(bg[bg.length - 1]);
  fx.uniforms.sheenColor = style.sheen ? css(style.sheen.color).withAlpha(style.sheen.alpha) : C.Color.TRANSPARENT;
  const hl = style.horizonLines;
  fx.uniforms.lineColor = hl ? css(hl.color).withAlpha(hl.alpha) : C.Color.TRANSPARENT;
  // Geometric spacing: `count` lines spanning `extent`, with the last gap `growth` times the first
  const count = hl?.count ?? 130, ratio = Math.pow(hl?.growth ?? 10, 1 / (count - 1));
  fx.uniforms.lineCount = count;
  fx.uniforms.lineRatio = ratio;
  fx.uniforms.lineFirst = (hl?.extent ?? 0.5) * (ratio - 1) / (Math.pow(ratio, count) - 1);
  fx.uniforms.lineOverGlobe = hl?.overGlobe ?? 0;
  const sh = style.shells;
  fx.uniforms.shellCount = sh?.count ?? 0;
  fx.uniforms.shellColor = sh ? css(sh.color).withAlpha(sh.alpha) : C.Color.TRANSPARENT;
  fx.uniforms.shellSpacing = sh?.spacing ?? 0.05;
  fx.uniforms.shellEdge = sh?.edge ?? 0;
  fx.uniforms.patternColor = style.pattern ? css(style.pattern.color).withAlpha(style.pattern.alpha) : C.Color.TRANSPARENT;
  fx.uniforms.patternScale = style.pattern?.scale ?? 6;
  fx.uniforms.paper = style.paper?.amount ?? 0;
  fx.uniforms.paperScale = style.paper?.scale ?? 4;
  fx.uniforms.vignette = style.vignette;
  scene.skyBox.show = style.stars;
  scene.skyAtmosphere.show = style.atmosphere;
  scene.globe.showGroundAtmosphere = style.groundHaze;
  scene.fog.enabled = style.groundHaze;

  const o = style.outline;
  for (const en of outlineEntities) {
    en.polyline.width = o.width;
    en.polyline.material = o.glow > 0
      ? new C.PolylineGlowMaterialProperty({ glowPower: o.glow, color: css(o.color) })
      : new C.ColorMaterialProperty(css(o.color));
  }
  setLines('borders', lineSets.borders, style.borders);
  const grids = [].concat(style.graticule || []);
  for (let i = 0; i < 3; i++) setLines('graticule' + i, grids[i] ? graticule(grids[i].step) : [], grids[i]);
  setDots(style.dots);

  fx.uniforms.limbColor = css(style.limb?.color ?? '#ffffff');
  fx.uniforms.limbWidth = style.limb?.width ?? 0;
  fx.uniforms.limbGlow = style.limb?.glow ?? 0;
  fx.uniforms.grain = style.grain;

  syncAll(); applyLook();
}

function applyCamera() {
  camera.frustum.fov = rad(s.fov);
  camera.lookAt(C.Cartesian3.fromDegrees(s.lon, s.lat, 0), new C.HeadingPitchRange(rad(s.heading), rad(s.pitch), s.range * 1000));
  camera.twistRight(rad(s.roll));
  updateReadout();
}

function applyLook() {
  for (const l of Object.values(layers)) { l.brightness = s.brightness; l.contrast = s.contrast; }
  const bloom = scene.postProcessStages.bloom;
  bloom.enabled = s.bloom > 0;
  bloom.uniforms.glowOnly = false;
  bloom.uniforms.contrast = 128;
  bloom.uniforms.brightness = -0.3 + s.bloom * 0.25;
  bloom.uniforms.delta = 1;
  bloom.uniforms.sigma = 2 + s.bloom * 2;
  bloom.uniforms.stepSize = 1;
}

function cameraView() {
  const c = C.Cartographic.fromCartesian(camera.positionWC);
  return { lat: deg(c.latitude), lon: deg(c.longitude), alt: c.height,
           heading: (deg(camera.heading) + 360) % 360, pitch: deg(camera.pitch), roll: deg(camera.roll) };
}

function updateReadout() {
  const v = cameraView(), R = 6371;
  const h = v.alt / 1000;
  const horizonKm = Math.sqrt(2 * R * h + h * h);
  const dip = deg(Math.acos(R / (R + h)));
  document.getElementById('readout').textContent =
`Camera lat/lon   ${v.lat.toFixed(4)}, ${v.lon.toFixed(4)}
Altitude         ${h.toFixed(0)} km
Heading          ${v.heading.toFixed(1)}°
Tilt (GE)        ${(90 + v.pitch).toFixed(1)}°   (pitch ${v.pitch.toFixed(1)}°)
Roll             ${v.roll.toFixed(1)}°
Vertical FOV     ${s.fov}°
Horizon          ${horizonKm.toFixed(0)} km away, ${dip.toFixed(1)}° below level`;
}

// ---- controls ----
function slider(parent, key, label, min, max, step, onChange) {
  const row = document.createElement('label');
  row.className = 'row';
  row.innerHTML = `${label}<input type="range" min="${min}" max="${max}" step="${step}"><output></output>`;
  const input = row.querySelector('input'), out = row.querySelector('output');
  input.addEventListener('input', () => { s[key] = +input.value; out.textContent = input.value; onChange(); });
  parent.appendChild(row);
  return () => { input.value = s[key]; out.textContent = s[key]; };
}
const sync = [];
const cam = document.getElementById('sliders'), look = document.getElementById('lookSliders');
sync.push(slider(cam, 'range', 'Distance km', 300, 9000, 10, applyCamera));
sync.push(slider(cam, 'pitch', 'Tilt', -90, -3, 0.5, applyCamera));
sync.push(slider(cam, 'heading', 'Heading', -180, 180, 0.5, applyCamera));
sync.push(slider(cam, 'roll', 'Roll', -60, 60, 0.5, applyCamera));
sync.push(slider(cam, 'fov', 'Lens FOV', 10, 110, 1, applyCamera));
sync.push(slider(cam, 'lat', 'Target lat', 30, 45, 0.05, applyCamera));
sync.push(slider(cam, 'lon', 'Target lon', -126, -110, 0.05, applyCamera));
sync.push(slider(look, 'brightness', 'Brightness', 0.3, 4, 0.05, applyLook));
sync.push(slider(look, 'contrast', 'Contrast', 0.5, 3, 0.05, applyLook));
sync.push(slider(look, 'mask', 'Dim outside', 0, 0.95, 0.01, () => {}));
sync.push(slider(look, 'bloom', 'City glow', 0, 4, 0.1, applyLook));
const syncAll = () => sync.forEach(f => f());

const presetBox = document.getElementById('presets');
for (const [name, p] of Object.entries(PRESETS)) {
  const b = document.createElement('button');
  b.textContent = name;
  b.onclick = () => { Object.assign(s, p); syncAll(); applyCamera(); };
  presetBox.appendChild(b);
}

const styleSelect = document.getElementById('style');
for (const [key, st] of Object.entries(GLOBE_STYLES)) styleSelect.add(new Option(st.name || key, key));
styleSelect.onchange = e => applyStyle(e.target.value);
document.getElementById('outline').onchange = e => outlineEntities.forEach(en => en.show = e.target.checked);
document.getElementById('guides').onchange = e => document.getElementById('safe').classList.toggle('on', e.target.checked);
const aspectSelect = document.getElementById('aspect');
function fitFrame() {
  const [w, h] = aspectSelect.value.split('/').map(Number), a = w / h;
  const stage = document.querySelector('.stage');
  let fw = stage.clientWidth, fh = fw / a;
  if (window.innerWidth > 760 && fh > stage.clientHeight) { fh = stage.clientHeight; fw = fh * a; }
  const frame = document.getElementById('frame');
  frame.style.width = fw + 'px';
  frame.style.height = fh + 'px';
}
aspectSelect.onchange = fitFrame;
window.addEventListener('resize', fitFrame);
fitFrame();
viewer.resize();

// Mouse: drag = orbit, shift-drag = move target, alt-drag = roll, wheel = distance
const canvas = scene.canvas;
let drag = null;
canvas.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY }; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointerup', () => drag = null);
canvas.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  drag = { x: e.clientX, y: e.clientY };
  if (e.altKey) s.roll = C.Math.clamp(s.roll + dx * 0.2, -60, 60);
  else if (e.shiftKey) {
    const k = s.range / 120000 * 5;
    const h = rad(s.heading);
    s.lon -= (dx * Math.cos(h) + dy * Math.sin(h)) * k / Math.cos(rad(s.lat));
    s.lat += (dy * Math.cos(h) - dx * Math.sin(h)) * k;
  } else {
    s.heading = ((s.heading - dx * 0.25 + 540) % 360) - 180;
    s.pitch = C.Math.clamp(s.pitch - dy * 0.2, -90, -3);
  }
  for (const k of ['heading', 'pitch', 'roll', 'lat', 'lon']) s[k] = +s[k].toFixed(2);
  syncAll(); applyCamera();
});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  s.range = Math.round(C.Math.clamp(s.range * Math.exp(e.deltaY * 0.001), 300, 9000));
  syncAll(); applyCamera();
}, { passive: false });

// ---- export ----
const status = msg => document.getElementById('status').textContent = msg;
document.getElementById('exportBtn').onclick = async () => {
  const targetH = +document.getElementById('exportH').value;
  const prev = viewer.resolutionScale;
  // Cesium multiplies resolutionScale by devicePixelRatio
  viewer.resolutionScale = targetH / (canvas.clientHeight * (window.devicePixelRatio || 1));
  status('Loading tiles at full resolution…');
  const t0 = performance.now();
  let settled = 0;
  await new Promise(resolve => {
    const tick = () => {
      viewer.resize(); // Cesium only resizes in its own loop, which may not have run yet
      viewer.render();
      settled = scene.globe.tilesLoaded ? settled + 1 : 0;
      if (settled > 10 || performance.now() - t0 > 45000) resolve(); else requestAnimationFrame(tick);
    };
    tick();
  });
  const url = canvas.toDataURL('image/png');
  const a = document.createElement('a');
  a.href = url;
  a.download = `california-globe-${canvas.width}x${canvas.height}.png`;
  a.click();
  status(`Exported ${canvas.width} × ${canvas.height}px`);
  viewer.resolutionScale = prev;
};

document.getElementById('kmlBtn').onclick = async () => {
  const v = cameraView();
  const kml = `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2"><Document><Placemark><name>California cover view</name>
<Camera><longitude>${v.lon.toFixed(5)}</longitude><latitude>${v.lat.toFixed(5)}</latitude><altitude>${v.alt.toFixed(0)}</altitude>
<heading>${v.heading.toFixed(2)}</heading><tilt>${(90 + v.pitch).toFixed(2)}</tilt><roll>${v.roll.toFixed(2)}</roll>
<altitudeMode>absolute</altitudeMode></Camera></Placemark></Document></kml>`;
  try { await navigator.clipboard.writeText(kml); status('KML copied: paste into Google Earth Pro’s Places panel, then double-click it.'); }
  catch { document.getElementById('readout').textContent = kml; status('Clipboard blocked; KML shown below.'); }
};

window.app = { s, applyCamera, applyStyle, viewer, state: () => ({ dots: dotPrims?.length, landMask: !!landMask, lights: !!lightGrid }) };
applyStyle(styleSelect.value); applyCamera();
dataReady.then(() => applyStyle(styleSelect.value));
new ResizeObserver(() => applyCamera()).observe(document.getElementById('frame'));
</script>
</body>
</html>
